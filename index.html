<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CricketIQ - AI Powered Fan Intelligence</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="js/theme.js"></script>
    <style>
        /* Small animation for landing load */
        .landing-container {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease forwards;
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="landing-body">
    <div class="landing-overlay"></div>
    
    <button id="theme-toggle" class="theme-toggle-fixed" aria-label="Toggle Theme">☀️</button>

    <main class="landing-container">
        <section class="landing-hero">
            <h1>Turn raw cricket data into <br><span>fan-grade intelligence.</span></h1>
            <p>Experience deep statistical insights, momentum tracking, and AI-powered match analysis for the IPL and beyond.</p>
            
            <div style="display: flex; gap: 15px; margin-top: 30px; align-items: center;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div style="width:12px; height:12px; border-radius:50%; background:var(--accent-primary);"></div>
                    <span style="color:var(--text-primary); font-weight:600;">Live Match Updates</span>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div style="width:12px; height:12px; border-radius:50%; background:var(--accent-secondary);"></div>
                    <span style="color:var(--text-primary); font-weight:600;">Gemini AI Analyst</span>
                </div>
            </div>
        </section>

        <section class="landing-auth">
            <div class="glass-card">
                <div class="auth-tabs">
                    <button class="auth-tab active" id="tab-signin">Sign In</button>
                    <button class="auth-tab" id="tab-signup">Sign Up</button>
                </div>
                
                <form id="auth-form" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary" id="auth-submit">Sign In</button>
                </form>

                <div class="divider">or</div>

                <button class="google-btn" onclick="window.location.href='dashboard.html'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Sign in via Google
                </button>
            </div>
        </section>
    </main>

    <script src="js/landing.js"></script>
</body>
</html>
